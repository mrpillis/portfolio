<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/daniel-pillis.webp">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root {
      --text: #1a1a1a;
      --muted: #666;
      --faint: #9a9a9a;
      --link: #0b5aa8;
      --rule: #e4e4e4;
      --tag: #f1f1f1;
      --max: 800px;
      --thumb: 224px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0; background: #fff; color: var(--text);
      font: 16px/1.55 var(--font);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }
    img, video { max-width: 100%; height: auto; display: block; }
    h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0 0 1em; }
    p:last-child { margin-bottom: 0; }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

    /* Header ----------------------------------------------------------- */
    .site-header { padding: 56px 0 8px; }
    .site-header h1 { font-size: 2rem; }
    .site-header .role { color: var(--muted); margin: 6px 0 0; }
    .site-nav { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
    .site-nav a { color: var(--text); font-weight: 500; }
    .site-nav a:hover { color: var(--link); text-decoration: none; }

    /* Sections --------------------------------------------------------- */
    section { padding: 40px 0 8px; scroll-margin-top: 24px; }
    section > h2 { font-size: 1.4rem; margin-bottom: 18px; }
    section > h2 + p.lede { color: var(--muted); margin: -8px 0 22px; }

    /* Intro ------------------------------------------------------------ */
    .intro { display: grid; grid-template-columns: 1fr 220px; gap: 36px; align-items: start; padding-top: 36px; }
    .intro p { font-size: 1.08rem; }
    .intro .contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 16px; font-weight: 500; }
    .intro img { width: 100%; border-radius: 6px; }

    /* Work rows -------------------------------------------------------- */
    .work { display: grid; grid-template-columns: var(--thumb) 1fr; gap: 22px 28px; padding: 22px 0; border-top: 1px solid var(--rule); align-items: start; }
    .work:first-of-type { border-top: 0; padding-top: 4px; }
    .work .media { border-radius: 6px; overflow: hidden; background: #f4f4f4; aspect-ratio: 4 / 3; }
    .work .media img, .work .media video { width: 100%; height: 100%; object-fit: cover; }
    .work h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .work .authors { color: var(--muted); font-size: 0.95rem; }
    .work .authors b { color: var(--text); font-weight: 600; }
    .work .venue { margin: 8px 0 8px; font-size: 0.9rem; color: var(--muted); }
    .work .venue .tag { display: inline-block; background: var(--tag); color: var(--text); padding: 1px 8px; border-radius: 4px; font-weight: 500; margin-right: 6px; }
    .work .links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.95rem; font-weight: 500; margin-bottom: 8px; }
    .work .desc { font-size: 0.95rem; color: #333; }

    .compact .work { --thumb: 150px; padding: 16px 0; gap: 16px 22px; }
    .compact .work h3 { font-size: 1rem; }
    .compact .work .desc { font-size: 0.92rem; }
    .compact .work .venue { margin: 4px 0 6px; }

    /* News ------------------------------------------------------------- */
    .news { list-style: none; margin: 0; padding: 0; }
    .news li { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 0.95rem; }
    .news li:first-child { border-top: 0; padding-top: 0; }
    .news time { color: var(--muted); }
    .news[data-collapsed="true"] li:nth-child(n+7) { display: none; }
    .news-toggle { margin-top: 12px; background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 12px; font: inherit; font-size: 0.9rem; color: var(--text); cursor: pointer; }
    .news-toggle:hover { border-color: var(--muted); }

    /* Teaching --------------------------------------------------------- */
    .teaching { list-style: none; margin: 0; padding: 0; }
    .teaching li { padding: 10px 0; border-top: 1px solid var(--rule); }
    .teaching li:first-child { border-top: 0; padding-top: 0; }
    .teaching .meta { color: var(--muted); font-size: 0.95rem; }

    /* Bio / footer ----------------------------------------------------- */
    .bio p { max-width: 68ch; }
    .site-footer { margin-top: 48px; padding: 24px 0 40px; border-top: 1px solid var(--rule); color: var(--faint); font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
    .site-footer a { color: var(--muted); }
    .notfound { padding: 80px 0; }

    @media (max-width: 680px) {
      .site-header { padding-top: 36px; }
      .site-header h1 { font-size: 1.7rem; }
      .intro { grid-template-columns: 1fr; gap: 24px; }
      .intro picture { order: -1; }
      .intro img { width: 160px; }
      .work, .compact .work { grid-template-columns: 1fr; gap: 12px; }
      .work .media { max-width: 420px; }
      .news li { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1><a href="{{ site.baseurl }}/" style="color:inherit">{{ site.title }}</a></h1>
      <p class="role">Assistant Professor, Emerson College<br>Director, Human Interaction Simulation Lab</p>
      <nav class="site-nav" aria-label="Sections">
        <a href="{{ site.baseurl }}/#research">Research</a>
        <a href="{{ site.baseurl }}/#news">News</a>
        <a href="{{ site.baseurl }}/#teaching">Teaching</a>
        <a href="{{ site.baseurl }}/#bio">Bio</a>
      </nav>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <span>© {{ site.time | date: "%Y" }} Daniel Pillis</span>
      <span><a href="{{ site.links.website }}">dpillis.com</a> · <a href="{{ site.links.github }}">GitHub</a> · <a href="{{ site.links.linkedin }}">LinkedIn</a></span>
    </footer>
  </div>

  <script>
    // Play looping project videos only while they're on screen; otherwise show the poster.
    (function () {
      var vids = document.querySelectorAll('video[data-src]');
      if (!vids.length) return;
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) return;
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var v = e.target;
          if (e.isIntersecting) {
            if (!v.src) v.src = v.dataset.src;
            v.play().catch(function () {});
          } else if (v.src) {
            v.pause();
          }
        });
      }, { rootMargin: '200px 0px' });
      vids.forEach(function (v) { io.observe(v); });
    })();
    var t = document.querySelector('.news-toggle');
    if (t) t.addEventListener('click', function () {
      var list = document.querySelector('.news');
      var open = list.getAttribute('data-collapsed') === 'false';
      list.setAttribute('data-collapsed', open ? 'true' : 'false');
      t.textContent = open ? 'Show all news' : 'Show fewer';
      t.setAttribute('aria-expanded', !open);
    });
  </script>
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ site.google_analytics }}');</script>
  {% endif %}
</body>
</html>
