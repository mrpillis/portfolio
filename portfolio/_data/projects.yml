# Links: any of website, paper, code, video, article, press, slides

- title: "Towards Temporal Telepresence & Multisensory Spatial Intelligence: Reconstructing the Human Experience through TeleAbsence"
  media: teleabsence
  featured: true
  authors: "<b>Daniel Pillis</b>, Hiroshi Ishii, Alaa Algargoosh, Lucy Li, Jean-Baptiste Labrune"
  affiliation: "MIT Media Lab, Tangible Media Group"
  venue: "IEEE VR"
  year: 2025
  links:
    paper: https://ieeexplore.ieee.org/document/10972379
  description: >-
    Ongoing research into how immersive systems can preserve autobiographical
    memory by combining tangible objects, 3D scans of real environments, and
    virtual artifacts grounded in lived experience. Designed to support
    intergenerational memory sharing, these systems enable a form of
    telepresence across time.

- title: "Temporal Telepresence with Gaussian Splatting"
  media: gaussian-splat
  featured: true
  authors: "<b>Daniel Pillis</b>"
  affiliation: "MIT Media Lab"
  venue: "MIT Thesis"
  year: 2024
  links:
    website: https://www.dpillis.com/220-jefferson-simulation
    paper: https://dspace.mit.edu/handle/1721.1/157709
  description: >-
    Interaction with memory reconstructions of complex personal spaces using
    Gaussian splatting paired with sensory stimuli. From object-level 3D scans,
    depth-rendered home movies, and personal anecdotes we built digital twins
    to study the therapeutic potential of autobiographical simulation. In a
    study of 16 family members, combining sensory stimuli with splats increased
    memory vividness.

- title: "Real-time Stable Diffusion for Virtual Production: Room-Scale Generative AI towards the Ultimate Display"
  media: virtual-production
  featured: true
  authors: "<b>Daniel Pillis</b>"
  affiliation: "MIT Media Lab"
  venue: "MIT GenAI for Design Workshop"
  year: 2025
  note: "Best Presentation"
  links:
    website: https://www.dpillis.com/live-cinema-simulator
    article: https://www.media.mit.edu/galleries/best-presentation-at-the-generative-ai-for-design-workshop-2025/
    video: https://dac.siggraph.org/sparks/2025-03-ai-and-artistic-autonomy
  description: >-
    Real-time Stable Diffusion integrated into TouchDesigner and driven onto a
    high-resolution LED wall for dynamic virtual production. Case studies show
    how generative AI accelerates set design, props, and storytelling for
    in-camera VFX.

- title: "Perceive More by Seeing Less: Vision Augmentation Systems"
  media: vision-augmentation
  featured: true
  authors: "<b>Daniel Pillis</b>, Pawan Sinha, Cayden Pierce, Ken Zolot, Seth Riskin, Yuriy Reznik"
  affiliation: "Emerson College, MIT, RLE at MIT, Mentra"
  venue: "ACM SAP"
  year: 2026
  links:
    website: https://www.dpillis.com/home/vision-simulations
    paper: https://drive.google.com/file/d/1oJNoeiF320VqGavFst4igESFtAtLHnM3/view?usp=sharing
  description: >-
    Diminished-reality systems that apply live spatial-frequency filters to
    mixed-reality pass-through video. Selectively removing or enhancing
    frequency bands alters perception in real time, with roots in vision
    rehabilitation and applications in attention, accessibility, and cognitive
    enhancement.

- title: "AI Comes Out of the Closet: Using AI-Generated Virtual Characters to Help Individuals Practice LGBTQIA+ Advocacy"
  media: ai-comes-out
  featured: true
  authors: "<b>Daniel Pillis</b>, Pat Pataranutaporn, Pattie Maes, Misha Sra"
  affiliation: "MIT Media Lab"
  venue: "ACM IUI"
  year: 2024
  links:
    website: https://www.dpillis.com/ai-comes-out
    paper: https://dl.acm.org/doi/10.1145/3640543.3645213
  description: >-
    An online simulation in which large-language-model-driven, motion-captured
    virtual characters hold conversations about LGBTQIA+ experiences,
    particularly coming out. A study with 307 participants examines how these
    characters affect empathy, confidence, and advocacy.

- title: "AI Theatre: Interactive Conversational Interfaces with Virtual Agents Can Increase Confidence and Self-Efficacy in Devising Solutions for Interpersonal Conflict"
  media: ai-theatre
  featured: true
  authors: "<b>Daniel Pillis</b>*, Pat Pataranutaporn*, Pattie Maes, Misha Sra"
  affiliation: "MIT Media Lab"
  venue: "Preprint"
  year: 2024
  links:
    website: https://www.dpillis.com/ai-theatre
  description: >-
    Inspired by Augusto Boal's theater as a tool for change, AI Theatre uses
    multi-agent conversations with AI-driven characters to simulate
    interpersonal conflict so people can rehearse resolution strategies. A
    240-participant study showed increased confidence and skill in managing
    conflict.

- title: "Return of the Jibo: Social Robots and Generative AI in Film-Making Education"
  media: return-of-the-jibo
  featured: true
  authors: "<b>Daniel Pillis</b>, Jon Ferguson"
  affiliation: "MIT Media Lab"
  venue: "MIT DSpace"
  year: 2025
  links:
    website: https://www.dpillis.com/return-of-the-jibo
    paper: https://dspace.mit.edu/handle/1721.1/163137
    video: https://www.youtube.com/watch?v=jYrwAUo7rjw
  description: >-
    Jibo, a social robot, deployed in college classrooms as both character and
    collaborator: helping students write scripts, storyboard, and act in
    AI-generated films. The study documents higher engagement, emotional
    bonding, and reduced anxiety in AI-assisted creative learning.

