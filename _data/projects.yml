- title: "The Memory Machine: Immersive Reconstruction of Autobiographical Memory using Gaussian Splatting, World Models, and Interactive Agents"
  page: /projects/memory-machine/
  media: memory-machine.webp
  featured: true
  authors: "<b>Daniel Pillis</b> et al."
  affiliation: "Emerson College, MIT Media Lab"
  venue: "IEEE ISMAR"
  year: 2026
  links: {}
  description: >-
    A five-stage pipeline that turns a personal archive into an editable,
    immersive memory: photogrammetry paired with Gaussian splats, a world
    model built from 360° photography, LLM-directed 3D agents that enact a
    typed memory, compositing into a head-mounted experience, and generative
    synthesis trained only on the user's own media. Built on the 4 TB
    Jefferson Drive Dataset and the design principles of TeleAbsence.

- title: "Multisensory Spatial Memory: A Large-Scale, Synchronized Multi-Sensory Dataset of Embodied Interaction with Reconstructed Autobiographical Spaces"
  page: /projects/multisensory-spatial-memory/
  media: multisensory-spatial-memory.webp
  featured: true
  authors: "<b>Daniel Pillis</b> et al."
  affiliation: "Emerson College, MIT Media Lab"
  venue: "CVPR Sense of Space Workshop"
  year: 2026
  note: "Denver, CO"
  links: {}
  description: >-
    The Jefferson Drive Dataset: 18 rooms across four floors, 800+ individually
    scanned objects, 5,886 analog photographs, and 40+ hours of digitized 8mm
    and 16mm film from one home occupied for five decades, with synchronized
    gaze, pose, audio, touch, and narration from 18 former occupants revisiting
    it in mixed reality.

- title: "Humanoids at Home: Autobiographical Semantic Maps for Humanoid Motion from Memory in a Reconstructed Domestic Environment"
  page: /projects/humanoids-at-home/
  media: humanoids-at-home.webp
  featured: true
  authors: "<b>Daniel Pillis</b> et al."
  affiliation: "Emerson College"
  venue: "IROS SeMaNa Workshop"
  year: 2026
  links: {}
  description: >-
    Semantic maps that encode not just what an object is but what it means to
    the people who lived with it. Former occupants annotate a reconstructed
    home in mixed reality; motion-captured avatars of the same people are then
    replayed through it to generate memory-conditioned navigation data for
    domestic robots.

