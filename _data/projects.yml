- title: "The Jibo Trio: A Cappella Performance by Networked Social Robots"
  page: /projects/jibo-trio/
  media: jibo-trio.webp
  featured: true
  authors: "<b>Daniel Pillis</b>, Jon Ferguson"
  affiliation: "Emerson College, MIT Media Lab"
  venue: "ICSR"
  year: 2026
  note: "London"
  links: {}
  description: >-
    Three networked Jibo robots performing live a cappella. A Rosbridge, MCP,
    and ESML control architecture synchronizes speech, animation, and gaze from
    a single TouchDesigner interface, staging multi-robot flocking as
    theatrical spectacle and asking whether robots in harmony feel more alive
    than one alone.

- title: "Perceive More by Seeing Less: Immersive Vision Augmentation Systems to Support Vision Rehabilitation"
  page: /projects/perceive-more-by-seeing-less/
  media: vision-augmentation.gif
  featured: true
  authors: "<b>Daniel Pillis</b>*, Cayden Pierce*, Seth Riskin, Yuriy Reznik, Ken Zolot, Pawan Sinha"
  affiliation: "Emerson College, MIT, Mentra"
  venue: "IEEE ISMAR"
  year: 2026
  links:
    website: https://www.dpillis.com/home/vision-simulations
  description: >-
    Five real-time spatial-frequency filters applied to Varjo XR-3 pass-through
    video: high pass, low pass, edge enhancement, color inversion, and
    kaleidoscope. Motivated by vision rehabilitation for children recovering
    from treatable blindness, the system shows how diminished reality can
    heighten perception; over 200 people used it in a public exhibition.

- title: "Towards Temporal Telepresence & Multisensory Spatial Intelligence: Reconstructing the Human Experience through TeleAbsence"
  page: /projects/temporal-telepresence/
  media: teleabsence.gif
  featured: true
  authors: "<b>Daniel Pillis</b>"
  affiliation: "Emerson College, MIT Media Lab"
  venue: "IEEE VR Workshop on Memory"
  year: 2025
  links:
    paper: https://ieeexplore.ieee.org/document/10972379
  description: >-
    How immersive systems can preserve autobiographical memory by combining
    tangible objects, 3D scans of real environments, and virtual artifacts
    grounded in lived experience, supporting intergenerational memory sharing
    and a form of telepresence across time.

- title: "TeleAbsence: Visions of Afterlife Telepresence"
  page: /projects/teleabsence/
  media: teleabsence-presence.webp
  featured: true
  authors: "Hiroshi Ishii, <b>Daniel Pillis</b>*, Pat Pataranutaporn*, Xiao Xiao, Alaa Algargoosh, Lucy Li, Jean-Baptiste Labrune"
  affiliation: "MIT Media Lab, Tangible Media Group"
  venue: "Presence, MIT Press"
  year: 2025
  links:
    paper: https://doi.org/10.1162/pres_a_00441
  description: >-
    A vision of telepresence in the past: illusory, one-sided encounters with
    what a lost person left behind. Five design principles, Presence of
    Absence, Illusory Communications, Materiality of Memory, Traces of
    Reflection, and Remote Time, distinguish TeleAbsence from conventional
    telepresence and from generative impersonation of the departed.

